##begin config
version 1.1
basename Power
libbase PowerBase
libbasetype struct PowerBase
residentpri -120
options noexpunge
##end config
##begin cdef
#include <libraries/power.h>
#include <utility/tagitem.h>
#include <exec/ports.h>
#include <devices/timer.h>
##end cdef
##begin cdefprivate
#include "power_private.h"
##end cdefprivate
##begin functionlist
APTR AddPowerNotifyA(struct MsgPort *port, const struct TagItem *tags) (A0, A1)
void RemPowerNotify(APTR subscription) (A0)
LONG PowerSleepA(ULONG depth, const struct TagItem *tags) (D0, A0)
LONG GetPowerStateA(struct PowerState *state, const struct TagItem *tags) (A0, A1)
APTR AddPowerWakeA(const struct timeval *date, struct MsgPort *port, const struct TagItem *tags) (A0, A1, A2)
ULONG RemPowerWake(APTR wake) (A0)
##end functionlist
