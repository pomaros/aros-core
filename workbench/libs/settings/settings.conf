##begin config
version 1.0
basename Settings
libbase SettingsBase
libbasetype struct SettingsBase
residentpri -120
options noexpunge
##end config
##begin cdef
#include <libraries/settings.h>
#include <utility/hooks.h>
#include <exec/ports.h>
##end cdef
##begin cdefprivate
#include "settings_private.h"
##end cdefprivate
##begin functionlist
LONG GetSettingA(CONST_STRPTR key, STRPTR buffer, ULONG size, const struct TagItem *tags) (A0, A1, D0, A2)
LONG SetSettingA(CONST_STRPTR key, CONST_STRPTR value, const struct TagItem *tags) (A0, A1, A2)
LONG ReplaceSettingsA(CONST_STRPTR file, struct Hook *hook, const struct TagItem *tags) (A0, A1, A2)
LONG NotifySettingA(CONST_STRPTR key, struct MsgPort *port, const struct TagItem *tags) (A0, A1, A2)
LONG EnumSettingsA(CONST_STRPTR prefix, struct Hook *hook, const struct TagItem *tags) (A0, A1, A2)
LONG DescribeSettingA(CONST_STRPTR key, struct SettingDescription *description, const struct TagItem *tags) (A0, A1, A2)
##end functionlist
